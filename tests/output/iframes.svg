<text x="75" y="232.5" fill="rgb(22, 33, 62)" dominant-baseline="text-before-edge" font-size="21px" font-family="Georgia, Times New Roman, serif">This demo mixes a same-origin iframe that loads another demo file with a rotated</text>
<text x="75" y="264" fill="rgb(22, 33, 62)" dominant-baseline="text-before-edge" font-size="21px" font-family="Georgia, Times New Roman, serif" xml:space="preserve">iframe rendered from srcdoc content. Enable </text>
<text x="496.39" y="264" fill="rgb(22, 33, 62)" dominant-baseline="text-before-edge" font-weight="700" font-size="21px" font-family="Georgia, Times New Roman, serif">walkIframes</text>
<text x="632.69" y="264" fill="rgb(22, 33, 62)" dominant-baseline="text-before-edge" font-size="21px" font-family="Georgia, Times New Roman, serif" xml:space="preserve"> to traverse those</text>
<text x="75" y="295.5" fill="rgb(22, 33, 62)" dominant-baseline="text-before-edge" font-size="21px" font-family="Georgia, Times New Roman, serif">nested documents and keep them in the same paint-order pipeline.</text>
