<text x="75" y="111.5" fill="rgb(22, 33, 62)" dominant-baseline="text-before-edge" font-weight="700" font-size="52px" font-family="Georgia, Times New Roman, serif" letter-spacing="-1.56px">Embedded documents can now join the</text>
