<text x="246.42" y="452" fill="rgb(22, 33, 62)" dominant-baseline="text-before-edge" font-weight="700" font-size="17px" font-family="Georgia, Times New Roman, serif">text.html</text>
<text x="326.67" y="452" fill="rgb(22, 33, 62)" dominant-baseline="text-before-edge" font-size="17px" font-family="Georgia, Times New Roman, serif">, so this page exercises same-origin iframe</text>
